server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Quarto multi-page site: serve files and directories as-is
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Reasonable caching for hashed Quarto/Bootstrap assets
    location /site_libs/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
